services:
  notes:
    depends_on:
      - db
    build:
      target: prod
    container_name: notes
  
  test:
    build:
      target: test

  # call like `docker compose run --rm migrate up/down/force/...`
  migrate:
    image:
      migrate/migrate
    depends_on:
      - db
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - "-path=/migrations/"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}?sslmode=disable"

  db:
    image: postgres:19beta3-alpine3.24
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/19/docker
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
