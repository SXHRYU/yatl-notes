name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build CI image
        run: docker build --target ci -t notes:ci .

      - name: Save CI image
        run: docker save notes:ci | gzip > notes-ci.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: notes-ci-image
          path: notes-ci.tar.gz
          retention-days: 1

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: notes-ci-image

      - name: Load Docker image
        run: gunzip -c notes-ci.tar.gz | docker load

      - name: Run golangci-lint
        run: docker run --rm notes:ci golangci-lint run

  format:
    name: Format
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: notes-ci-image

      - name: Load Docker image
        run: gunzip -c notes-ci.tar.gz | docker load

      - name: Check formatting
        run: docker run --rm notes:ci golangci-lint fmt --diff

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: notes-ci-image

      - name: Load Docker image
        run: gunzip -c notes-ci.tar.gz | docker load

      - name: Run tests
        run: docker run --rm notes:ci go test ./...
